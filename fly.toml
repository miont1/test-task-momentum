# fly.toml app configuration file generated for test-momentum
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'test-momentum'
primary_region = 'fra'

[build]

[env]
  DATABASE_URL = 'sqlite+aiosqlite:////tmp/helpdesk.db'
  RUN_MIGRATIONS = 'true'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
