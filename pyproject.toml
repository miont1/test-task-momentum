[project]
name = "helpdesk-assistant"
version = "0.1.0"
description = "AI-First Helpdesk Assistant Backend"
readme = "AGENTS.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "celery[redis]>=5.7.0",
    "email-validator>=2.3.0",
    "fastapi>=0.115.0",
    "openai>=3.46.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-mock>=3.17.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]


